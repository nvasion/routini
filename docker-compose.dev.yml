# Development stack with hot reload: the API runs embedded Postgres and its
# worker inline, so there is nothing else to start.
#
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:5173   (sign in as admin@routini.dev / changeme)

services:
  server:
    build: { context: ./server, dockerfile: Dockerfile.dev }
    restart: unless-stopped
    ports: ["3001:3001"]
    volumes:
      - ./server:/app
      - server_modules:/app/node_modules
      - server_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: development
      PORT: "3001"
      CLIENT_URL: "${CLIENT_URL:-http://localhost:5173}"
      ROUTINI_DATA_DIR: /app/data/pg
      # Dev-only fixed key (hex of "routini-dev-master-key-32bytes!!") so stored secrets survive restarts.
      CREDENTIALS_MASTER_KEY: "${CREDENTIALS_MASTER_KEY:-726f7574696e692d6465762d6d61737465722d6b65792d333262797465732121}"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-in-production}"

  client:
    build: { context: ./client, dockerfile: Dockerfile.dev }
    restart: unless-stopped
    ports: ["5173:5173"]
    volumes:
      - ./client:/app
      - client_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: "http://server:3001"
    depends_on: [server]

volumes:
  server_modules:
  client_modules:
  server_data:
