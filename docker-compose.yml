# Routini — production-style stack
#
#   cp .env.example .env      # fill in the three secrets
#   make agents               # build the Claude Code agent image
#   docker compose up --build -d
#   open http://localhost     # the first account you create owns the server
#
# Services: Postgres, the API, a worker (scheduler + queue + agent containers),
# nginx serving the console and, with the `broker` profile, the egress proxy
# (credential broker). Scale workers with `--scale worker=N`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: routini
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-routini}"
      POSTGRES_DB: routini
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routini -d routini"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: { context: ./server }
    restart: unless-stopped
    expose: ["3001"]
    depends_on:
      postgres: { condition: service_healthy }
    environment: &server-env
      NODE_ENV: production
      DATABASE_URL: "postgres://routini:${POSTGRES_PASSWORD:-routini}@postgres:5432/routini"
      ROUTINI_MODE: "${ROUTINI_MODE:-selfhost}"
      ROUTINI_SIGNUP: "${ROUTINI_SIGNUP:-first-user-only}"
      CLIENT_URL: "${CLIENT_URL:-http://localhost}"
      # Where runners, monitoring tools and MCP clients reach this server (default CLIENT_URL),
      # and where agent containers reach it for Routini's own tools (default: the public URL).
      ROUTINI_PUBLIC_URL: "${ROUTINI_PUBLIC_URL:-}"
      ROUTINI_AGENT_API_URL: "${ROUTINI_AGENT_API_URL:-}"
      # Sign in with TynHub (or any OIDC provider); all three or none.
      ROUTINI_OIDC_ISSUER: "${ROUTINI_OIDC_ISSUER:-}"
      ROUTINI_OIDC_CLIENT_ID: "${ROUTINI_OIDC_CLIENT_ID:-}"
      ROUTINI_OIDC_CLIENT_SECRET: "${ROUTINI_OIDC_CLIENT_SECRET:-}"
      ROUTINI_OIDC_NAME: "${ROUTINI_OIDC_NAME:-TynHub}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      COOKIE_SECRET: "${COOKIE_SECRET:?set COOKIE_SECRET in .env}"
      CREDENTIALS_MASTER_KEY: "${CREDENTIALS_MASTER_KEY:?set CREDENTIALS_MASTER_KEY in .env}"
      ROUTINI_AGENT_IMAGE_CLAUDE: "${ROUTINI_AGENT_IMAGE_CLAUDE:-routini/agent-claude:latest}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-noreply@routini.dev}"
      # The API provisions environments and serves their terminals, so it
      # needs Docker too (same host as the worker's agent containers).
      DOCKER_HOST: "${DOCKER_HOST:-unix:///var/run/docker.sock}"
      # Credential broker (enabled when ROUTINI_EGRESS_SECRET is set and the
      # `broker` profile is on; required in hosted mode for agent steps).
      ROUTINI_EGRESS_CONTROL_URL: "${ROUTINI_EGRESS_CONTROL_URL:-http://egress:3129}"
      ROUTINI_EGRESS_SECRET: "${ROUTINI_EGRESS_SECRET:-}"
      ROUTINI_EGRESS_CONTAINER: routini-egress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:-999}"]

  # Credential broker: the only way out for sandboxed agent and environment
  # containers. Enforces the org egress allow-list and injects credentials
  # for bound hosts, so containers only ever hold placeholders.
  # Enable with COMPOSE_PROFILES=broker and ROUTINI_EGRESS_SECRET in .env.
  egress:
    build: { context: ./server }
    profiles: ["broker"]
    # Fixed name: the broker attaches this container to each org sandbox network.
    container_name: routini-egress
    restart: unless-stopped
    command: ["node", "dist/egress.js"]
    expose: ["3128", "3129"]
    environment:
      ROUTINI_EGRESS_SECRET: "${ROUTINI_EGRESS_SECRET:-}"
      # Persist the CA so long-lived environments keep trusting it.
      ROUTINI_EGRESS_CA_DIR: /app/data/ca
    volumes:
      # Mounted at /app/data (owned by the node user in the image).
      - egress_ca:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3129/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build: { context: ./server }
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres: { condition: service_healthy }
      server: { condition: service_healthy }
    environment:
      <<: *server-env
      # Local Docker by default. For production, point DOCKER_HOST at a
      # dedicated runner host (ssh://… or tcp://… with TLS) instead of
      # mounting the socket: the socket is root-equivalent on this host.
      DOCKER_HOST: "${DOCKER_HOST:-unix:///var/run/docker.sock}"
      ROUTINI_WORKER_CONCURRENCY: "${ROUTINI_WORKER_CONCURRENCY:-4}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The node user needs the socket's group: DOCKER_GID=$(stat -c %g /var/run/docker.sock)
    group_add: ["${DOCKER_GID:-999}"]
    healthcheck:
      disable: true

  client:
    build: { context: ./client }
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on:
      server: { condition: service_healthy }

volumes:
  pg_data:
  egress_ca:
