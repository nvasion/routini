# The console on a platform router (DigitalOcean App Platform): the router sends
# /api, /mcp and /health to the API component itself, so nginx only serves the
# built app. Build with:  docker build --build-arg NGINX_CONF=nginx.platform.conf client
# (nginx.conf, the Compose default, proxies those paths to the `server` service.)

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: React Router handles client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
