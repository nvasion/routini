# The console on a platform router (DigitalOcean App Platform): the router sends
# /api, /mcp and /health to the API component itself, so nginx only serves the
# built app. Build with:  docker build --build-arg NGINX_CONF=nginx.platform.conf client
# (nginx.conf, the Compose default, proxies those paths to the `server` service.)

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # nginx's stock mime.types has no entry for the web app manifest.
    types {
        application/manifest+json webmanifest;
    }

    # Served by scripts/prerender.mjs; noindex and with every module script
    # stripped, so a crawler landing on an unknown path gets a real 404
    # status instead of the SPA silently redirecting it to "/".
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # The old getting-started guide is part of How it works now; keep its
    # links working. Browsers keep the #fragment across a 301.
    location = /docs/getting-started {
        return 301 /how-it-works;
    }

    # Hashed assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # App routes never prerender: serve the plain (noindex) SPA shell and let
    # React Router take over client-side.
    location ~ ^/(app|o|login|signup|forgot-password|reset-password|verify-email)(/|$) {
        add_header Cache-Control "no-cache";
        try_files /spa.html =404;
    }

    # Everything else is a prerendered public page (or its own 404).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
