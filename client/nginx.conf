# WebSocket upgrades (terminals, routini-runner connections) need Connection: upgrade; everything
# else gets an empty Connection header so keep-alive to the API works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # nginx's stock mime.types has no entry for the web app manifest.
    types {
        application/manifest+json webmanifest;
    }

    # Served by scripts/prerender.mjs; noindex and with every module script
    # stripped, so a crawler landing on an unknown path gets a real 404
    # status instead of the SPA silently redirecting it to "/".
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # The old getting-started guide is part of How it works now; keep its
    # links working. Browsers keep the #fragment across a 301.
    location = /docs/getting-started {
        return 301 /how-it-works;
    }

    # The API, including server-sent event streams (/runs/:id/stream, /stream).
    # Streams need buffering off and a read timeout well above the server's
    # 15-second heartbeat.
    location /api/ {
        proxy_pass         http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        client_max_body_size 2m;
    }

    # Routini as an MCP server (Streamable HTTP, POST only).
    location = /mcp {
        proxy_pass         http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 5m;
        client_max_body_size 1m;
    }

    location = /health {
        proxy_pass         http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Hashed assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # App routes never prerender: serve the plain (noindex) SPA shell and let
    # React Router take over client-side.
    location ~ ^/(app|o|login|signup|forgot-password|reset-password|verify-email)(/|$) {
        add_header Cache-Control "no-cache";
        try_files /spa.html =404;
    }

    # Everything else is a prerendered public page (or its own 404).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
